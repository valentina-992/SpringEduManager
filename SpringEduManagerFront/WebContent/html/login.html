<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpringEduManager — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/login.css"/>
</head>
<body>

  <div class="login-wrapper fade-up">
    <div class="login-card">

      <div class="brand">
        <div class="brand-icon">🎓</div>
        <h1>SpringEduManager</h1>
        <p>Plataforma académica — ingresa con tu cuenta</p>
      </div>

      <div class="mb-3">
        <label class="label-custom" for="username">Usuario</label>
        <input type="text" id="username" class="input-custom" placeholder="tu.usuario" autocomplete="username"/>
      </div>

      <div class="mb-3">
        <label class="label-custom" for="password">Contraseña</label>
        <input type="password" id="password" class="input-custom" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button type="button" class="btn-primary-custom btn-login" id="btnLogin" onclick="handleLogin()">
        Ingresar
      </button>

      <div class="alert-error mt-3" id="errorMsg"></div>

      <hr class="divider-custom"/>
      <p class="footer-note">SpringEduManager &copy; 2026 — Alkemy Módulo 6</p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>

</body>
</html>
