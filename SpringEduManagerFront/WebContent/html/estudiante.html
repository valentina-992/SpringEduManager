<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpringEduManager — Mi Tablero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/estudiante.css"/>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar-custom">
    <div class="navbar-brand-custom">
      <div class="brand-icon">🎓</div>
      <h1>SpringEduManager</h1>
    </div>
    <div class="navbar-right">
      <span class="navbar-user">Hola, <span id="estudianteUsername"></span></span>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <main class="main-content">

    <!-- Bienvenida -->
    <div class="welcome-card">
      <div class="welcome-avatar">🎓</div>
      <div class="welcome-text">
        <h2 id="welcomeNombre">Cargando...</h2>
        <p id="welcomeCorreo"></p>
      </div>
    </div>

    <!-- Tablero de cursos y evaluaciones -->
    <p class="section-title">Mis cursos y evaluaciones</p>
    <div id="tablero">
      <div class="empty-state">
        <div style="font-size:2rem">⏳</div>
        <p>Cargando tu tablero...</p>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/estudiante.js"></script>
</body>
</html>
